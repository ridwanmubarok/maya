version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: maya_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: maya_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maya_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: maya_bot
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/maya_db?schema=public
    ports:
      - "${PORT:-3000}:3000"

volumes:
  postgres_data:
